name: Release

# Creates a GitHub Release with a ready-to-play Windows build
# whenever you push a tag such as v1.0.0
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish (self-contained, single file, win-x64)
        run: >
          dotnet publish src/LittleHero/LittleHero.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -o publish

      - name: Zip the game
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath LittleHero-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: LittleHero-win-x64.zip
          generate_release_notes: true
